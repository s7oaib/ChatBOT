services:
  - type: web
    name: camellia-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ENABLE_WEB_TESTER
        value: "false"
      - key: WHATSAPP_MOCK_MODE
        value: "true"
      - key: BYPASS_AD_GATE
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.7
