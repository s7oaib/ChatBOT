services:
  - type: web
    name: camellia-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ENABLE_WEB_TESTER
        value: "false"
      # Must stay false on any deployment that serves real customers. In mock
      # mode the bot never constructs an outbound request: it accepts webhooks,
      # matches, logs a reply, and sends nothing, so customers get silence while
      # the process looks perfectly healthy. This was previously "true" here.
      - key: WHATSAPP_MOCK_MODE
        value: "false"
      # Auto-reply to every Instagram DM, not just ad-originated ones.
      #
      # The Ad-Gate (PRD #4) exists so organic DMs are left in the inbox for a
      # human. The client wants the bot answering everyone, so it is bypassed
      # here. The consequence is real: every organic DM now gets a bot reply
      # first, including complaints and one-off personal messages, so the
      # escalation triggers in qa_templates.json are the only thing routing
      # those to a human. Set back to "false" to return to ad-only replies.
      - key: BYPASS_AD_GATE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.7
    # Set in the Render dashboard, never committed: META_APP_SECRET,
    # WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, INSTAGRAM_ACCESS_TOKEN,
    # ADMIN_API_KEY, ADMIN_PIN, GROQ_API_KEY.
    # Once META_APP_SECRET is set and /health reports webhook_signature
    # "enforced", also set REQUIRE_WEBHOOK_SIGNATURE=true.
