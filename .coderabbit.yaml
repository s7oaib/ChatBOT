# CodeRabbit Configuration File
# https://docs.coderabbit.ai/getting-started/configure-coderabbit/

language: "en-US"
tone_instructions: |
  Focus on production reliability, Python type safety, FastAPI performance, 
  webhook security, and clear unit test coverage. Be concise and actionable.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!*.json"
    - "!*.jpeg"
    - "!*.jpg"
    - "!*.png"
    - "!*.svg"
  path_instructions:
    - path: "camellia/app.py"
      instructions: "Check for FastAPI error handling, HMAC-SHA256 signature verification, and admin key protection."
    - path: "camellia/responder.py"
      instructions: "Ensure exact template matching logic, session memory integration, and image suppression behavior."
    - path: "camellia/order_calculator.py"
      instructions: "Check unit price lookups, itemized receipt formatting, and mathematical correctness."
    - path: "camellia/ai_responder.py"
      instructions: "Verify provider cooldown handling, prompt-size budgets, and that AI output never bypasses the approval gate."
    - path: "tests/test_bot.py"
      instructions: "Verify unit test completeness and ensure mock objects properly simulate external network calls."

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
