version: '3.8'

services:
  camellia-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camellia_artisanal_bot
    restart: always
    ports:
      - "8000:8000"
    environment:
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      - META_APP_SECRET=${META_APP_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      # Browser sessions use username/password; API tools use ADMIN_API_KEY.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      # Used only to build the manual customer-facing wa.me handoff link.
      - WHATSAPP_BUSINESS_NUMBER=${WHATSAPP_BUSINESS_NUMBER:-}
      - INSTAGRAM_PAGE_ID=${INSTAGRAM_PAGE_ID}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-https://web-production-0cad70.up.railway.app/auth/instagram/callback}
      - INSTAGRAM_EXPECTED_USERNAME=${INSTAGRAM_EXPECTED_USERNAME:-camellia.artisanal}
      # Must live under the mounted volume or all history is lost on rebuild.
      # Deliberately /app/var, not /app/data: the volume would otherwise hide
      # the menu.json and qa_templates.json baked into the image.
      - DB_PATH=/app/var/camellia.db
      # The /chat tester writes real rows and pages the owner; keep it off here
      - ENABLE_WEB_TESTER=${ENABLE_WEB_TESTER:-false}
      # Auto-replies to organic Instagram DMs too when true — leave off unless asked
      - BYPASS_AD_GATE=${BYPASS_AD_GATE:-false}
      # Optional one-click menu sync from a published Google Sheet CSV
      - GOOGLE_SHEET_CSV_URL=${GOOGLE_SHEET_CSV_URL:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - BUSINESS_LEGAL_NAME=${BUSINESS_LEGAL_NAME:-Camellia Artisanal}
      - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL:-owner@camelliaartisanal.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      # Menu photo OCR. The chat model above cannot see; this one can, on the
      # same key. https://console.groq.com/docs/vision
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      # Optional polish only — kept under SLOW_REPLY_THRESHOLD_MS so a slow
      # provider is abandoned rather than delaying the customer's reply.
      - GROQ_REFINE_TIMEOUT=${GROQ_REFINE_TIMEOUT:-2.5}
      - GROQ_ENABLED=${GROQ_ENABLED:-true}
      # Tells a customer once, when replies have gone slow, to contact the
      # Kitchen Manager directly. The copy promises a limited period, so
      # SLOW_REPLY_NOTICE_UNTIL (YYYY-MM-DD) must be set when switching it on.
      - SLOW_REPLY_NOTICE_ENABLED=${SLOW_REPLY_NOTICE_ENABLED:-true}
      - SLOW_REPLY_THRESHOLD_MS=${SLOW_REPLY_THRESHOLD_MS:-3000}
      - SLOW_REPLY_NOTICE_UNTIL=${SLOW_REPLY_NOTICE_UNTIL:-}
      - SLOW_REPLY_NOTICE_TEXT=${SLOW_REPLY_NOTICE_TEXT:-}
    volumes:
      - camellia_db_data:/app/var

volumes:
  camellia_db_data:
