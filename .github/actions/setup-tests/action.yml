name: Cached Camellia test environment
description: Same Python and dependencies for both required test gates
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt
    - shell: bash
      run: python -m pip install -r requirements.txt -r requirements-test.txt
