name: Full Regression Verify cfba

on:
  push:
    branches:
      - codex/full-regression-verify-cfba

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      META_APP_SECRET: "test_secret_for_ci_pipeline"
      ADMIN_API_KEY: "test_admin_api_key_ci"
      DB_PATH: "test_camellia_ci.db"
      ENABLE_WEB_TESTER: "true"
      WHATSAPP_BUSINESS_NUMBER: "919800000000"
      INSTAGRAM_STORY_AUTO_SYNC_ENABLED: "false"
      LLM_AUTO_RESOLVE_ENABLED: "false"
    steps:
      - name: Checkout exact validated infrastructure SHA
        uses: actions/checkout@v4
        with:
          ref: cfba04404e4b6e09c8b1d877af569b016fd86798
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Run full regression on exact SHA
        run: python -m pytest -q
