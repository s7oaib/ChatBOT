name: Camellia Bot CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "maintenance/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: camellia-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast current-contract gate (Python 3.11)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      PYTHONHASHSEED: "0"
      META_APP_SECRET: "test_secret_for_ci_pipeline"
      ADMIN_API_KEY: "test_admin_api_key_ci"
      DB_PATH: "test_camellia_ci.db"
      ENABLE_WEB_TESTER: "true"
      WHATSAPP_BUSINESS_NUMBER: "919800000000"
      INSTAGRAM_STORY_AUTO_SYNC_ENABLED: "false"
      LLM_AUTO_RESOLVE_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up cached test environment
        uses: ./.github/actions/setup-tests

      - name: Syntax and undefined-name checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,.git,__pycache__

      - name: Validate menu and QA schemas
        run: python scripts/validate_schemas.py

      - name: Run current-contract and webhook security gate
        run: python scripts/run_impacted_tests.py --current-contract --workers 2

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-contract-execution
          path: .test-results/
          include-hidden-files: true

  full-regression:
    name: Full regression (Python 3.11)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'pull_request' && github.head_ref == 'qa-c1-instagram-chatbot-control')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONHASHSEED: "0"
      META_APP_SECRET: "test_secret_for_ci_pipeline"
      ADMIN_API_KEY: "test_admin_api_key_ci"
      DB_PATH: "test_camellia_ci.db"
      ENABLE_WEB_TESTER: "true"
      WHATSAPP_BUSINESS_NUMBER: "919800000000"
      INSTAGRAM_STORY_AUTO_SYNC_ENABLED: "false"
      LLM_AUTO_RESOLVE_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up cached test environment
        uses: ./.github/actions/setup-tests

      - name: Syntax and undefined-name checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,.git,__pycache__

      - name: Validate menu and QA schemas
        run: python scripts/validate_schemas.py

      - name: Run full regression suite
        run: python scripts/run_impacted_tests.py --full --workers 2

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-execution
          path: .test-results/
          include-hidden-files: true
